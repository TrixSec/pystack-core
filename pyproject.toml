[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pystack-core"
version = "0.1.0"
description = "Operating System for Python Applications - Unified runtime layer with configuration, logging, HTTP, caching, databases, AI, and more."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [
    { name = "Vicky", email = "trixcyrus666@gmail.com" }
]
keywords = [
    "runtime",
    "framework",
    "configuration",
    "logging",
    "http",
    "cache",
    "database",
    "ai",
    "async",
    "productivity"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
async = [
    "asyncpg>=0.28.0",
    "aioredis>=2.0.0",
]
cache = [
    "aioredis>=2.0.0",
]
database = [
    "asyncpg>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.5.0",
]
queue = [
    "aioredis>=2.0.0",
    "celery>=5.3.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/TrixSec/pystack-core"
Repository = "https://github.com/TrixSec/pystack-core"
Issues = "https://github.com/TrixSec/pystack-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["py_core"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["py_core"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
